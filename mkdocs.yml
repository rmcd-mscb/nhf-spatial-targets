      - Python patterns: architecture/python-patterns.md
      - Reconcile manifest: architecture/reconcile-manifest.md
  - Sources:
      - Overview: sources/index.md
      - ERA5-Land: sources/era5_land.md
      - GLDAS: sources/gldas.md
      - MERRA-2: sources/merra2.md
      - NLDAS-MOSAIC: sources/nldas_mosaic.md
      - NLDAS-NOAH: sources/nldas_noah.md
      - NCEP/NCAR: sources/ncep_ncar.md
      - WaterGAP 2.2d: sources/watergap22d.md
      - Reitz 2017: sources/reitz2017.md
      - MOD16A2 v061: sources/mod16a2_v061.md
      - MOD10C1 v061: sources/mod10c1_v061.md
      - MWBM ClimGrid: sources/mwbm_climgrid.md
      - Daymet: sources/daymet.md
      - SNODAS: sources/snodas.md
      - Margulis WUS-SR: sources/margulis_wus_sr.md
      - UA SWE: sources/ua_swe.md
      - SSEBop: sources/ssebop.md
  - References:
      - TM 6-B10 crib sheet: references/tm6b10-summary.md
      - PRMSobjfun summary: references/prmsobjfun-summary.md
      - Calibration target recipes: references/calibration-target-recipes.md
      - Pipeline architecture reference: references/pipeline-architecture-reference.md
      - Processing steps reference: references/processing-steps-reference.md
      - Known gaps resolved: references/known-gaps-resolved.md
      - Target period coverage: references/target-period-coverage.md
      - Lessons learned: references/lessons-learned.md
  - Data release:
      - Overview: data_release/README.md
      - USGS data release process: data_release/usgs-process.md
      - FGDC field map: data_release/fgdc-field-map.md
      - sciencebasepy notes: data_release/sciencebasepy-notes.md
  - API reference:
      - Overview: api/index.md
      - Catalog: api/catalog.md
      - Workspace: api/workspace.md
      - NetCDF I/O: api/io-nc.md
      - Source adapter: api/aggregate-adapter.md
      - Target adapter: api/targets-adapter.md
