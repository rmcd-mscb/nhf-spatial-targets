[workspace]
name = "nhf-spatial-targets"
version = "0.1.0"
description = "Curated calibration target datasets for the National Hydrologic Model"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]

[dependencies]
python = ">=3.11,<3.14"
pyyaml = ">=6.0"
xarray = ">=2024.1"
numpy = ">=1.26"
pandas = ">=2.0"
geopandas = ">=0.14"
rioxarray = ">=0.15"
netcdf4 = ">=1.6"
h5netcdf = ">=1.3"
dask = ">=2024.1"
cyclopts = ">=3.0"
rich = ">=13.0"
tqdm = ">=4.60"
libgdal-hdf4 = ">=3.12.2,<4"
pangaeapy = ">=1.1.0,<2"
cdsapi = "*"
# proj-data: bundle PROJ grid shift files locally so PROJ_NETWORK is set
# OFF by the conda activation script — required behind firewalls where
# PROJ's CDN fetch fails.
proj-data = "*"
scipy = ">=1.17.1,<2"
# lxml: FGDC XML pretty-print + optional well-formedness checks in the
# release/ metadata renderers (PR-D2). Conda-forge build pulls libxml2.
lxml = ">=5.0"
# ruamel.yaml: round-trip (comment- and key-order-preserving) YAML for the
# release publish-state registry (release/registry.py, PR-E2). plain
# yaml.safe_dump would strip catalog/release_registry.yml's comment header.
"ruamel.yaml" = ">=0.18"
# gdptools: spatial aggregation (install from PyPI if not on conda-forge)
# sciencebasepy: ScienceBase access
# earthaccess: NASA EDL access for MODIS, MERRA-2, NLDAS

[pypi-dependencies]
nhf-spatial-targets = { path = ".", editable = true }
gdptools = ">=0.3.13"
sciencebasepy = "*"
earthaccess = "*"
# pygeometa: MCF v3 intermediate representation + ISO 19139 emission for
# the ScienceBase data release (release/mcf.py, release/iso.py). Pinned to a
# compatible-release range: the ISO XML goldens (tests/test_release_iso.py)
# assert byte-equality, so a pygeometa minor bump that reflows its output
# would red the suite. Bump deliberately and regenerate the goldens.
pygeometa = "~=0.21.1"
# jinja2: README + FGDC templates (release/readme.py, release/fgdc.py).
jinja2 = ">=3.1"

[feature.dev.dependencies]
pytest = ">=8.0"
pytest-cov = ">=5.0"
# pytest-xdist: parallelize the ~1.5k-test suite across CI cores (-n auto).
# The suite is overwhelmingly independent tmp_path tests, so workers don't
# contend; ~halves CI wall-clock (issue #289).
pytest-xdist = ">=3.5"
ruff = ">=0.4"
mypy = ">=1.10"
ipykernel = ">=6.0"
jupyterlab = ">=4.0"
pre-commit = ">=4.0"
gh = ">=2.0"
# cfchecker: CEDA CF-conventions compliance checker; provides the `cfchecks`
# CLI for validating that pipeline-written NetCDFs are CF-1.6 compliant.
cfchecker = ">=4.1"

[feature.marp.dependencies]
# Marp slide-deck rendering toolchain. Kept in its own feature (not dev) so
# operators who only run the pipeline don't pay the nodejs + chrome download
# cost (~250 MB total) unless they need to render presentation decks.
#
# Two-step install:
#     pixi install -e marp           # pulls nodejs (+ chrome system deps on linux)
#     pixi run -e marp marp-setup    # downloads chrome-headless-shell via puppeteer
#                                    # (~50 MB; cached in ~/.cache/puppeteer)
#
# Chromium isn't on conda-forge directly, so we use puppeteer's official
# chrome-headless-shell downloader instead — it pins a revision compatible
# with the puppeteer that marp-cli bundles internally, which is what we want
# for reproducible PDF rendering across machines.
nodejs = ">=20"

[feature.marp.target.linux-64.dependencies]
# chrome-headless-shell on bare HPC needs two system libs that aren't part of
# a minimal cluster image: libgbm (graphics buffer manager — even headless
# rendering uses it for off-screen buffer alloc) and alsa-lib (audio
# subsystem — chrome calls into it on startup even with no audio). Both
# Linux-only. macOS / Windows operators already have system Chrome and use
# the workstation render path documented in docs/presentations/README.md.
libgbm = ">=1.0"
alsa-lib = ">=1.2"

[feature.marp.target.linux-64.activation.env]
# Chrome is a pre-built non-conda binary downloaded by `marp-setup`, so it
# doesn't have rpath pointing at the pixi env's libdir. Prepend
# $CONDA_PREFIX/lib so chrome-headless-shell finds the libgbm + alsa-lib
# pulled in above. Scoped to the marp env's activation (does not leak into
# default/dev).
#
# The `${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}` form (vs the obvious
# `:$LD_LIBRARY_PATH`) only appends the colon when the variable is set
# and non-empty. Without the guard, an unset $LD_LIBRARY_PATH expands to
# an empty string and leaves a trailing `:` — which per `ld.so(8)` means
# "search current dir" (mild security smell + nondeterminism).
# silent-failure-hunter review of #209.
LD_LIBRARY_PATH = "$CONDA_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"

[feature.docs.dependencies]
# MkDocs + Material documentation site (local browsing of docs/architecture,
# docs/sources, docs/references + auto-generated API reference via
# mkdocstrings). Kept in its own feature (not dev) so operators who only
# run the pipeline don't pay the ~30 MB install cost unless they want to
# browse the docs locally.
#
# Usage:
#     pixi install -e docs         # ~30 MB of pure-python wheels
#     pixi run docs-serve          # http://127.0.0.1:8000 with hot reload
#     pixi run docs-build          # one-shot build (CI-style; --strict by default)
#
# mkdocstrings-python reads numpy-style docstrings from src/ to render
# the API reference pages under docs/api/. docs-serve watches src/ so a
# docstring edit live-refreshes the rendered API page.
mkdocs = ">=1.6"
mkdocs-material = ">=9.5"
mkdocstrings = ">=0.26"
mkdocstrings-python = ">=1.11"
# mkdocstrings-python uses ruff to format the API-page function signatures
# (otherwise it emits a one-line INFO complaint and renders signatures unformatted).
ruff = ">=0.4"

[environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
# Marp feature is nodejs-only (chrome is downloaded post-install by
# `pixi run -e marp marp-setup`), so it solves cleanly on every workspace
# platform without needing the default solve-group's deeper pin matrix.
marp = { features = ["marp"], solve-group = "marp" }
# Docs feature is pure-python (mkdocs + material + mkdocstrings); solves
# cleanly in the default solve-group alongside dev.
docs = { features = ["docs"], solve-group = "default" }

[tasks]
# Initialise a project.
# Usage: pixi run init -- --project-dir /data/nhf-runs/my-run
init = { cmd = "nhf-targets init", description = "Create a new project skeleton" }

# Materialise credentials from .credentials.yml into ~/.cdsapirc and ~/.netrc.
# Usage: pixi run materialize-creds -- --project-dir /data/nhf-runs/my-run
materialize-creds = { cmd = "nhf-targets materialize-credentials", description = "Write ~/.cdsapirc and ~/.netrc from .credentials.yml" }

# Validate a project (run after editing config.yml).
# Usage: pixi run validate -- --project-dir /data/nhf-runs/my-run
validate = { cmd = "nhf-targets validate", description = "Validate project config and fabric" }

# Run the full pipeline against a project.
# Usage: pixi run run -- --project-dir /data/nhf-runs/my-run
run = { cmd = "nhf-targets run", description = "Run the full target pipeline" }

# Run individual targets — pass --project-dir as extra arg.
run-runoff = { cmd = "nhf-targets run --target runoff" }
run-aet    = { cmd = "nhf-targets run --target aet" }
run-rch    = { cmd = "nhf-targets run --target recharge" }
run-som    = { cmd = "nhf-targets run --target soil_moisture" }
run-sca    = { cmd = "nhf-targets run --target snow_covered_area" }
run-swe    = { cmd = "nhf-targets run --target snow_water_equivalent" }

# Existing-project catch-up / maintenance — pass --project-dir as extra arg.
# See docs/maintenance.md for the catch-up sequences (new config key / source /
# manifest field) and the validate-after-config-edit ordering rule.
# check-* are report-only (exit non-zero on drift); rebuild-manifest/rechunk
# regenerate derived artifacts (both accept --dry-run).
check-config     = { cmd = "nhf-targets maintenance check-config",     description = "Report optional-config features missing from a project's config.yml (report-only)" }
check-manifest   = { cmd = "nhf-targets maintenance check-manifest",   description = "Report whether manifest.json predates the current schema (report-only)" }
rebuild-manifest = { cmd = "nhf-targets maintenance rebuild-manifest", description = "Regenerate manifest.json as a deterministic projection of on-disk artifacts" }
rechunk          = { cmd = "nhf-targets maintenance rechunk",          description = "Backfill aggregated/target NCs to the chunked+compressed layout (#165)" }

# Fetch source data
fetch-era5-land = { cmd = "nhf-targets fetch era5-land", description = "Download ERA5-Land data into a project datastore" }
fetch-gldas = { cmd = "nhf-targets fetch gldas", description = "Download GLDAS-2 runoff data into a project datastore" }
fetch-merra2 = { cmd = "nhf-targets fetch merra2", description = "Download MERRA-2 data into a project datastore" }
fetch-nldas-mosaic = { cmd = "nhf-targets fetch nldas-mosaic", description = "Download NLDAS-2 MOSAIC data into a project datastore" }
fetch-nldas-noah = { cmd = "nhf-targets fetch nldas-noah", description = "Download NLDAS-2 NOAH data into a project datastore" }
fetch-ncep-ncar = { cmd = "nhf-targets fetch ncep-ncar", description = "Download NCEP/NCAR Reanalysis data into a project datastore" }
fetch-watergap22d = { cmd = "nhf-targets fetch watergap22d", description = "Download WaterGAP 2.2d groundwater recharge from PANGAEA" }
fetch-reitz2017 = { cmd = "nhf-targets fetch reitz2017", description = "Download Reitz 2017 recharge estimates from ScienceBase" }
fetch-mod16a2 = { cmd = "nhf-targets fetch mod16a2", description = "Download MOD16A2 v061 AET data via earthaccess" }
fetch-mod10c1 = { cmd = "nhf-targets fetch mod10c1", description = "Download MOD10C1 v061 snow cover data via earthaccess" }
fetch-mwbm-climgrid = { cmd = "nhf-targets fetch mwbm-climgrid", description = "Download USGS MWBM (ClimGrid-forced) monthly outputs from ScienceBase" }
fetch-daymet = { cmd = "nhf-targets fetch daymet", description = "Register operator-staged Daymet V4 R1 regional zarr stores (verify-only)" }
fetch-snodas = { cmd = "nhf-targets fetch snodas", description = "Download SNODAS daily SWE granules from NSIDC (G02158) via earthaccess" }
fetch-margulis-wus-sr = { cmd = "nhf-targets fetch margulis-wus-sr", description = "Download Margulis Western US Snow Reanalysis (NSIDC-0719) via earthaccess" }
fetch-ua-swe = { cmd = "nhf-targets fetch ua-swe", description = "Download UA daily 4-km SWE/snow-depth (NSIDC-0719) + consolidate to calendar-year NCs" }
fetch-all = { cmd = "nhf-targets fetch all", description = "Download all source datasets sequentially" }

# Aggregation
agg-ssebop       = { cmd = "nhf-targets agg ssebop",       description = "Aggregate SSEBop AET to HRU fabric via STAC" }
agg-era5-land    = { cmd = "nhf-targets agg era5-land",    description = "Aggregate ERA5-Land runoff to HRU fabric" }
agg-gldas        = { cmd = "nhf-targets agg gldas",        description = "Aggregate GLDAS-2.1 NOAH runoff to HRU fabric" }
agg-merra2       = { cmd = "nhf-targets agg merra2",       description = "Aggregate MERRA-2 soil wetness to HRU fabric" }
agg-ncep-ncar    = { cmd = "nhf-targets agg ncep-ncar",    description = "Aggregate NCEP/NCAR soil moisture to HRU fabric" }
agg-nldas-mosaic = { cmd = "nhf-targets agg nldas-mosaic", description = "Aggregate NLDAS-2 MOSAIC soil moisture to HRU fabric" }
agg-nldas-noah   = { cmd = "nhf-targets agg nldas-noah",   description = "Aggregate NLDAS-2 NOAH soil moisture to HRU fabric" }
agg-watergap22d  = { cmd = "nhf-targets agg watergap22d",  description = "Aggregate WaterGAP 2.2d recharge to HRU fabric" }
agg-reitz2017    = { cmd = "nhf-targets agg reitz2017",    description = "Aggregate Reitz 2017 annual recharge to HRU fabric" }
agg-mod16a2      = { cmd = "nhf-targets agg mod16a2",      description = "Aggregate MOD16A2 v061 AET to HRU fabric" }
agg-mod10c1      = { cmd = "nhf-targets agg mod10c1",      description = "Aggregate MOD10C1 v061 SCA to HRU fabric" }
agg-daymet       = { cmd = "nhf-targets agg daymet",       description = "Aggregate Daymet V4 daily SWE (per region) to HRU fabric" }
agg-snodas       = { cmd = "nhf-targets agg snodas",       description = "Aggregate SNODAS daily SWE to HRU fabric" }
agg-mwbm-climgrid = { cmd = "nhf-targets agg mwbm-climgrid", description = "Aggregate USGS MWBM (ClimGrid-forced) monthly outputs to HRU fabric" }
agg-era5-land-sd = { cmd = "nhf-targets agg era5-land-sd", description = "Aggregate ERA5-Land daily snow depth water equivalent to HRU fabric" }
agg-margulis-wus-sr = { cmd = "nhf-targets agg margulis-wus-sr", description = "Aggregate Margulis WUS-SR daily SWE to HRU fabric (Western US coverage; NaN elsewhere)" }
agg-ua-swe       = { cmd = "nhf-targets agg ua-swe",       description = "Aggregate UA daily SWE + depth-derived snow_covered_fraction to HRU fabric (SWE + SCA source)" }
agg-all          = { cmd = "nhf-targets agg all",          description = "Aggregate all tier-1/2 sources to HRU fabric sequentially" }

# Catalog inspection
catalog-sources   = { cmd = "nhf-targets catalog sources" }
catalog-variables = { cmd = "nhf-targets catalog variables" }

# ScienceBase data release (PR-F). Pass --project-dir (and publish flags) as
# extra args, e.g.  pixi run release-build -- --project-dir /data/nhf-runs/gfv2
release-init      = { cmd = "nhf-targets release init",      description = "Scaffold a project's ScienceBase release directory" }
release-build     = { cmd = "nhf-targets release build",     description = "Build the ScienceBase release payload on disk (offline)" }
release-manifest  = { cmd = "nhf-targets release manifest",  description = "Recompute checksums for staged release items" }
release-dry-run   = { cmd = "nhf-targets release dry-run",   description = "Preview a ScienceBase release (read-only)" }
release-publish   = { cmd = "nhf-targets release publish",   description = "Publish the release to ScienceBase (idempotent)" }
release-status    = { cmd = "nhf-targets release status",    description = "Diff release intent vs ScienceBase" }
release-auth-test = { cmd = "nhf-targets release auth-test", description = "Check ScienceBase authentication" }

# Development
# xdist runs N worker processes; without capping BLAS/OMP thread pools each
# worker would spawn one-thread-per-core (on a 128-thread HPC login node that
# is N*128 threads -> pthread_create exhaustion). Pin every math backend to a
# single thread so the only parallelism is across xdist workers. Safe on CI
# (ubuntu-latest = 4 workers) and on caldera. (issue #289)
test  = { cmd = "pytest tests/ -n auto --durations=25 -m 'not integration'", description = "Run test suite in parallel (xdist; excludes integration)", env = { OMP_NUM_THREADS = "1", OPENBLAS_NUM_THREADS = "1", MKL_NUM_THREADS = "1", NUMEXPR_NUM_THREADS = "1", VECLIB_MAXIMUM_THREADS = "1" } }
test-quiet = { cmd = "pytest tests/ -n auto -q -m 'not integration'", description = "Run test suite quietly in parallel (for pre-commit hooks)", env = { OMP_NUM_THREADS = "1", OPENBLAS_NUM_THREADS = "1", MKL_NUM_THREADS = "1", NUMEXPR_NUM_THREADS = "1", VECLIB_MAXIMUM_THREADS = "1" } }
test-integration = { cmd = "pytest tests/ -v -m integration", description = "Run integration tests only (requires credentials/network)" }
lint  = { cmd = "ruff check src/ tests/", description = "Lint source" }
fmt   = { cmd = "ruff format src/ tests/", description = "Format source" }
fmt-check = { cmd = "ruff format --check src/ tests/", description = "Check formatting without modifying" }

# Register a Jupyter kernel pointing at the pixi dev env so VSCode /
# JupyterLab can select it. Matches the kernelspec name embedded in
# notebooks/aggregated/*.ipynb. Run once per machine:
#   pixi run -e dev install-kernel
install-kernel = { cmd = "python -m ipykernel install --user --name nhf-spatial-targets --display-name 'Python (nhf-spatial-targets)'", description = "Register Jupyter kernel for the pixi dev env (use with -e dev)" }

# Re-execute inspection notebooks and write PNGs to docs/figures/<group>/<project>/.
# Notebooks set _helpers.PROJECT themselves from PROJECT_DIR.name when run
# interactively. For headless renders, pass --project to namespace the output:
#     pixi run -e dev render-figures -- --project gfv2-spatial-targets
# Use the SLURM scripts (inspect_*.slurm) for HPC-scale memory.
render-figures              = { cmd = "python scripts/render_figures.py --group all",          description = "Re-execute all inspection notebooks and save figures to docs/figures/<group>/<project>/" }
render-figures-consolidated = { cmd = "python scripts/render_figures.py --group consolidated", description = "Re-execute consolidated notebooks and save to docs/figures/consolidated/<project>/" }
render-figures-aggregated   = { cmd = "python scripts/render_figures.py --group aggregated",   description = "Re-execute aggregated notebooks and save to docs/figures/aggregated/<project>/" }
render-figures-targets      = { cmd = "python scripts/render_figures.py --group targets",      description = "Re-execute target inspection notebooks and save to docs/figures/targets/<project>/" }
render-figures-fabric       = { cmd = "python scripts/render_figures.py --group fabric",       description = "Re-execute fabric inspection notebooks and save to docs/figures/fabric/<project>/" }

# Marp slide-deck rendering — runs puppeteer's downloaded chrome under
# marp-cli so the same `--pdf`/`--html`/`--server` workflow works on HPC
# as on a workstation with system Chrome. Two-step install:
#     pixi install -e marp           # pulls nodejs
#     pixi run -e marp marp-setup    # downloads chrome into ~/.cache/puppeteer
# Then:
#     pixi run -e marp render-deck docs/presentations/<file>.slides.md --pdf
#     pixi run -e marp render-deck docs/presentations/<file>.slides.md --html
#     pixi run -e marp render-deck docs/presentations/ --server
[feature.marp.tasks]
marp-setup = { cmd = "npx --yes puppeteer browsers install chrome-headless-shell", description = "One-shot: download chrome-headless-shell via puppeteer (smaller + fewer system deps than full chrome — works on bare HPC)" }
render-deck = { cmd = "python scripts/render_deck.py", description = "Render a Marp .slides.md deck (PDF/HTML/server) via marp-cli" }

# MkDocs + Material local documentation site (issue #233). Pure-python
# install (~30 MB); no system deps. mkdocstrings consumes the existing
# numpy-style docstrings from src/ to render API reference pages.
#
#     pixi install -e docs
#     pixi run docs-serve          # http://127.0.0.1:8000 with hot reload
#     pixi run docs-build          # one-shot build (--strict catches broken links)
[feature.docs.tasks]
docs-serve = { cmd = "mkdocs serve --watch src", description = "Serve docs locally at http://127.0.0.1:8000 with hot reload on docs/ and src/" }
docs-build = { cmd = "mkdocs build --strict", description = "Build the docs site once; --strict fails on broken internal links" }
