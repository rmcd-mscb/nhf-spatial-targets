datastore: /tmp/nhf-datastore-fixture
fabric:
  path: /tmp/fabrics/gfv2_nhru_merged.gpkg
  id_col: nat_hru_id
release:
  authors:
    - given: Jane
      family: Doe
      orcid: 0000-0000-0000-0000
      affiliation: U.S. Geological Survey
    - given: John
      family: Roe
  ipds_number: IP-123456
  doi: null
