# Populated release defaults fixture for the release/ golden tests
# (test_release_defaults.py, test_release_mcf.py, test_release_readme.py).
# Mirrors the schema of the committed catalog/release_defaults.yml so the
# MCF builders read the same keys; values are realistic so the golden MCF /
# README outputs are meaningful. Kept independent of the committed file so
# editing production boilerplate does not churn the golden fixtures.
metadata:
  language: en
  charset: utf8
contacts:
  distributor:
    organization: U.S. Geological Survey - ScienceBase
    url: https://www.sciencebase.gov
    individualname: ScienceBase Data Release Team
    positionname: Distributor
    phone: 1-888-275-8747
    fax: ""
    address: Building 810, Mail Stop 302, Denver Federal Center
    city: Denver
    administrativearea: CO
    postalcode: "80225"
    country: USA
    email: sciencebase@usgs.gov
  point_of_contact:
